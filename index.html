<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e8" />
  <title>Flower Line of Action</title>
  <style>
    :root{
      --bg:#f4f1e8; --card:#fffdf8; --ink:#18211b; --muted:#6f776f;
      --accent:#3f5d4b; --accent2:#dfe8df; --line:#d7d8cf; --danger:#9a3f3f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
    body{min-height:100vh}
    button,select,input{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(1100px,100%);margin:auto;padding:18px}
    header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
    h1{font-size:clamp(28px,5vw,50px);line-height:1;margin:0 0 10px}
    .sub{color:var(--muted);font-size:15px}
    .toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
    .control{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
    .control label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    select,input{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink)}
    .stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(25,35,25,.08)}
    .image-wrap{position:relative;height:min(67vh,720px);min-height:420px;background:#e9e8df;display:grid;place-items:center}
    .image-wrap img{width:100%;height:100%;object-fit:contain;display:block;background:#ecebe4}
    .image-wrap.cover img{object-fit:cover}
    .status{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);background:#ecebe4}
    .hidden{display:none!important}
    .timer{position:absolute;right:18px;top:18px;width:116px;height:116px;border-radius:999px;background:rgba(24,33,27,.86);color:white;display:grid;place-items:center;text-align:center;backdrop-filter:blur(8px)}
    .timer strong{display:block;font-size:30px;line-height:1}
    .timer span{font-size:11px;letter-spacing:.12em}
    .progress{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);width:100%;transform-origin:left}
    .info{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 20px}
    .names h2{margin:0 0 5px;font-size:clamp(24px,4vw,36px)}
    .names p{margin:2px 0;color:var(--muted)}
    .links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn,.linkbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn:disabled{opacity:.45}
    .actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:12px}
    .tip{font-size:13px;color:var(--muted);text-align:center;margin:15px 0 5px}
    .error{color:var(--danger)}
    @media(max-width:760px){
      .toolbar{grid-template-columns:1fr 1fr}
      .actions{grid-template-columns:1fr 1fr 1fr}
      .info{display:block}
      .links{justify-content:flex-start;margin-top:12px}
      .image-wrap{height:58vh;min-height:380px}
      .timer{width:92px;height:92px;right:12px;top:12px}
      .timer strong{font-size:25px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Flower Line of Action</h1>
      <div class="sub">随机花卉写生练习 · 自动计时 · 点击查看植物百科</div>
    </div>
  </header>

  <section class="toolbar">
    <div class="control">
      <label for="duration">练习时间</label>
      <select id="duration">
        <option value="30">30 秒</option>
        <option value="60" selected>1 分钟</option>
        <option value="120">2 分钟</option>
        <option value="300">5 分钟</option>
        <option value="600">10 分钟</option>
        <option value="1200">20 分钟</option>
        <option value="1800">30 分钟</option>
        <option value="0">无限模式</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="control">
      <label for="customMinutes">自定义分钟</label>
      <input id="customMinutes" type="number" inputmode="decimal" min="0.1" step="0.1" value="15" disabled />
    </div>
    <div class="control">
      <label for="category">花卉分类</label>
      <select id="category">
        <option value="all">全部随机</option>
        <option value="rose">玫瑰</option>
        <option value="tulip">郁金香</option>
        <option value="sunflower">向日葵</option>
        <option value="orchid">兰花</option>
        <option value="camellia">山茶花</option>
        <option value="native">澳洲原生花卉</option>
        <option value="wildflower">野花</option>
      </select>
    </div>
    <div class="control">
      <label for="fitMode">图片显示</label>
      <select id="fitMode">
        <option value="contain">完整显示</option>
        <option value="cover">铺满画面</option>
      </select>
    </div>
  </section>

  <main class="stage">
    <div class="image-wrap" id="imageWrap">
      <a id="imageLink" href="#" target="_blank" rel="noopener" style="width:100%;height:100%;display:block">
        <img id="flowerImage" alt="随机花卉参考图片" />
      </a>
      <div id="status" class="status">正在准备花卉图片…</div>
      <div class="timer" id="timer">
        <div><strong id="timeText">1:00</strong><span id="timeLabel">SECONDS</span></div>
      </div>
      <div class="progress" id="progress"></div>
    </div>

    <section class="info" id="infoPanel">
      <div class="names">
        <h2 id="commonName">随机花卉</h2>
        <p id="englishName">Flower study</p>
        <p><em id="scientificName"></em></p>
        <p id="credit"></p>
      </div>
      <div class="links">
        <a class="linkbtn" id="wikiLink" href="#" target="_blank" rel="noopener">植物百科 ↗</a>
        <a class="linkbtn" id="sourceLink" href="#" target="_blank" rel="noopener">图片来源 ↗</a>
      </div>
    </section>
  </main>

  <section class="actions">
    <button class="btn primary" id="startBtn">开始</button>
    <button class="btn" id="pauseBtn">暂停</button>
    <button class="btn" id="resetBtn">重新计时</button>
    <button class="btn" id="nextBtn">下一朵</button>
    <button class="btn" id="hideBtn">隐藏资料</button>
    <button class="btn" id="fullBtn">全屏</button>
  </section>

  <div class="tip">快捷键：空格暂停/继续　→ 下一朵　R 重新计时　H 隐藏资料　F 全屏</div>
</div>

<script>
const flowers = [
  {c:"rose",zh:"红玫瑰",en:"Red rose",sci:"Rosa",file:"Rose flower.jpg",wiki:"https://en.wikipedia.org/wiki/Rose"},
  {c:"rose",zh:"粉玫瑰",en:"Pink rose",sci:"Rosa",file:"Pink rose flower.jpg",wiki:"https://en.wikipedia.org/wiki/Rose"},
  {c:"rose",zh:"白玫瑰",en:"White rose",sci:"Rosa",file:"White rose.jpg",wiki:"https://en.wikipedia.org/wiki/Rose"},
  {c:"tulip",zh:"红色郁金香",en:"Red tulip",sci:"Tulipa",file:"Red tulip.jpg",wiki:"https://en.wikipedia.org/wiki/Tulip"},
  {c:"tulip",zh:"黄色郁金香",en:"Yellow tulip",sci:"Tulipa",file:"Yellow tulip.jpg",wiki:"https://en.wikipedia.org/wiki/Tulip"},
  {c:"tulip",zh:"郁金香花田",en:"Tulip field",sci:"Tulipa",file:"Tulip field.jpg",wiki:"https://en.wikipedia.org/wiki/Tulip"},
  {c:"sunflower",zh:"向日葵",en:"Sunflower",sci:"Helianthus annuus",file:"Sunflower sky backdrop.jpg",wiki:"https://en.wikipedia.org/wiki/Common_sunflower"},
  {c:"sunflower",zh:"向日葵花盘",en:"Sunflower head",sci:"Helianthus annuus",file:"Sunflower from Silesia2.jpg",wiki:"https://en.wikipedia.org/wiki/Common_sunflower"},
  {c:"orchid",zh:"蝴蝶兰",en:"Moth orchid",sci:"Phalaenopsis",file:"Phalaenopsis orchid.jpg",wiki:"https://en.wikipedia.org/wiki/Phalaenopsis"},
  {c:"orchid",zh:"石斛兰",en:"Dendrobium orchid",sci:"Dendrobium",file:"Dendrobium nobile (BG Zurich)-01.JPG",wiki:"https://en.wikipedia.org/wiki/Dendrobium"},
  {c:"orchid",zh:"卡特兰",en:"Cattleya orchid",sci:"Cattleya",file:"Cattleya labiata.jpg",wiki:"https://en.wikipedia.org/wiki/Cattleya"},
  {c:"camellia",zh:"山茶花",en:"Camellia",sci:"Camellia japonica",file:"Camellia japonica Nobilissima.jpg",wiki:"https://en.wikipedia.org/wiki/Camellia_japonica"},
  {c:"camellia",zh:"粉色山茶花",en:"Pink camellia",sci:"Camellia japonica",file:"Camellia japonica pink flower.jpg",wiki:"https://en.wikipedia.org/wiki/Camellia_japonica"},
  {c:"native",zh:"红花银桦",en:"Red silky oak",sci:"Grevillea banksii",file:"Grevillea banksii red.jpg",wiki:"https://en.wikipedia.org/wiki/Grevillea_banksii"},
  {c:"native",zh:"帝王花",en:"King protea",sci:"Protea cynaroides",file:"Protea cynaroides 1.jpg",wiki:"https://en.wikipedia.org/wiki/Protea_cynaroides"},
  {c:"native",zh:"金合欢",en:"Golden wattle",sci:"Acacia pycnantha",file:"Acacia pycnantha Golden Wattle.jpg",wiki:"https://en.wikipedia.org/wiki/Acacia_pycnantha"},
  {c:"native",zh:"班克木花",en:"Banksia",sci:"Banksia",file:"Banksia integrifolia flower.jpg",wiki:"https://en.wikipedia.org/wiki/Banksia"},
  {c:"native",zh:"澳洲蜡花",en:"Geraldton wax",sci:"Chamelaucium uncinatum",file:"Chamelaucium uncinatum.jpg",wiki:"https://en.wikipedia.org/wiki/Chamelaucium_uncinatum"},
  {c:"wildflower",zh:"虞美人",en:"Common poppy",sci:"Papaver rhoeas",file:"Papaver rhoeas - Köhler–s Medizinal-Pflanzen-101.jpg",wiki:"https://en.wikipedia.org/wiki/Papaver_rhoeas"},
  {c:"wildflower",zh:"矢车菊",en:"Cornflower",sci:"Centaurea cyanus",file:"Cornflower.jpg",wiki:"https://en.wikipedia.org/wiki/Centaurea_cyanus"},
  {c:"wildflower",zh:"雏菊",en:"Common daisy",sci:"Bellis perennis",file:"Bellis perennis white (aka).jpg",wiki:"https://en.wikipedia.org/wiki/Bellis_perennis"},
  {c:"wildflower",zh:"薰衣草",en:"Lavender",sci:"Lavandula",file:"Single lavender flower02.jpg",wiki:"https://en.wikipedia.org/wiki/Lavandula"},
  {c:"wildflower",zh:"绣球花",en:"Hydrangea",sci:"Hydrangea macrophylla",file:"Hydrangea macrophylla - bigleaf hydrangea.jpg",wiki:"https://en.wikipedia.org/wiki/Hydrangea_macrophylla"},
  {c:"wildflower",zh:"牡丹",en:"Chinese peony",sci:"Paeonia lactiflora",file:"Paeonia lactiflora flower.jpg",wiki:"https://en.wikipedia.org/wiki/Paeonia_lactiflora"},
  {c:"wildflower",zh:"鸢尾花",en:"Iris",sci:"Iris germanica",file:"Iris germanica 001.JPG",wiki:"https://en.wikipedia.org/wiki/Iris_germanica"},
  {c:"wildflower",zh:"百合",en:"Lily",sci:"Lilium",file:"Lilium candidum 1.jpg",wiki:"https://en.wikipedia.org/wiki/Lilium"},
  {c:"wildflower",zh:"荷花",en:"Sacred lotus",sci:"Nelumbo nucifera",file:"Sacred lotus Nelumbo nucifera.jpg",wiki:"https://en.wikipedia.org/wiki/Nelumbo_nucifera"},
  {c:"wildflower",zh:"樱花",en:"Cherry blossom",sci:"Prunus serrulata",file:"Cherry blossoms at the Tidal Basin.jpg",wiki:"https://en.wikipedia.org/wiki/Cherry_blossom"}
];

const $ = id => document.getElementById(id);
const img = $("flowerImage"), status = $("status"), duration = $("duration"), customMinutes = $("customMinutes");
let current = null, timerId = null, running = false, total = 60, remaining = 60, lastIndex = -1;
let filtered = flowers.slice();

function commonsFile(file){
  return "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=1600";
}
function commonsPage(file){
  return "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(file.replaceAll(" ","_"));
}
function selectedSeconds(){
  if(duration.value === "custom") return Math.max(6, Math.round((Number(customMinutes.value)||15)*60));
  return Number(duration.value);
}
function formatTime(sec){
  if(sec===0) return "∞";
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function updateClock(){
  $("timeText").textContent = formatTime(remaining);
  $("timeLabel").textContent = total===0 ? "UNTIMED" : "SECONDS";
  $("progress").style.transform = total===0 ? "scaleX(1)" : `scaleX(${Math.max(0,remaining/total)})`;
}
function choosePool(){
  const cat=$("category").value;
  filtered = cat==="all" ? flowers.slice() : flowers.filter(f=>f.c===cat);
}
function nextFlower(autoStart=false){
  choosePool();
  if(!filtered.length) return;
  let idx;
  do { idx=Math.floor(Math.random()*filtered.length); } while(filtered.length>1 && idx===lastIndex);
  lastIndex=idx; current=filtered[idx];
  status.classList.remove("hidden");
  status.textContent="正在载入花卉图片…";
  img.style.opacity="0";
  const url=commonsFile(current.file);
  img.onload=()=>{
    status.classList.add("hidden");
    img.style.opacity="1";
  };
  img.onerror=()=>{
    status.innerHTML='<span class="error">这张图片暂时无法载入。正在尝试下一朵…</span>';
    setTimeout(()=>nextFlower(autoStart),900);
  };
  img.src=url;
  $("imageLink").href=current.wiki;
  $("commonName").textContent=current.zh;
  $("englishName").textContent=current.en;
  $("scientificName").textContent=current.sci;
  $("credit").textContent="图片：Wikimedia Commons";
  $("wikiLink").href=current.wiki;
  $("sourceLink").href=commonsPage(current.file);
  resetTimer(false);
  if(autoStart) startTimer();
}
function startTimer(){
  if(running) return;
  total=selectedSeconds();
  if(remaining<=0 || remaining>total || total===0) remaining=total;
  running=true;
  $("startBtn").textContent="继续";
  clearInterval(timerId);
  if(total===0){ updateClock(); return; }
  timerId=setInterval(()=>{
    remaining--;
    updateClock();
    if(remaining<=0){
      clearInterval(timerId); running=false;
      nextFlower(true);
    }
  },1000);
}
function pauseTimer(){ running=false; clearInterval(timerId); }
function resetTimer(start=false){
  pauseTimer();
  total=selectedSeconds(); remaining=total; updateClock();
  if(start) startTimer();
}
duration.addEventListener("change",()=>{
  customMinutes.disabled=duration.value!=="custom";
  resetTimer(false);
});
customMinutes.addEventListener("change",()=>resetTimer(false));
$("category").addEventListener("change",()=>nextFlower(running));
$("fitMode").addEventListener("change",()=>$("imageWrap").classList.toggle("cover",$("fitMode").value==="cover"));
$("startBtn").onclick=startTimer;
$("pauseBtn").onclick=pauseTimer;
$("resetBtn").onclick=()=>resetTimer(running);
$("nextBtn").onclick=()=>nextFlower(running);
$("hideBtn").onclick=()=>{
  $("infoPanel").classList.toggle("hidden");
  $("hideBtn").textContent=$("infoPanel").classList.contains("hidden")?"显示资料":"隐藏资料";
};
$("fullBtn").onclick=async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
};
document.addEventListener("keydown",e=>{
  if(["INPUT","SELECT"].includes(document.activeElement.tagName)) return;
  if(e.code==="Space"){e.preventDefault(); running?pauseTimer():startTimer();}
  if(e.key==="ArrowRight") nextFlower(running);
  if(e.key.toLowerCase()==="r") resetTimer(running);
  if(e.key.toLowerCase()==="h") $("hideBtn").click();
  if(e.key.toLowerCase()==="f") $("fullBtn").click();
});
window.addEventListener("online",()=>{ if(img.naturalWidth===0) nextFlower(running); });
total=selectedSeconds(); remaining=total; updateClock(); nextFlower(false);
</script>
</body>
</html>
