<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe7">
<title>Flower Line</title>
<style>
:root{
  --bg:#f2efe7;--card:#fffdfa;--ink:#182019;--muted:#70776f;
  --accent:#47604e;--line:#d9d8cf;--soft:#ebe9e1;--danger:#a44848
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(1180px,100%);margin:auto;padding:18px}
.brand{margin:2px 0 16px}
.brand h1{margin:0;font-size:clamp(30px,5vw,54px);letter-spacing:-.04em}
.brand p{margin:7px 0 0;color:var(--muted)}
.setup{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;
box-shadow:0 12px 34px rgba(25,33,26,.07)}
.setup h2{margin:0 0 16px;font-size:20px}
.time-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.time-card{border:1px solid var(--line);background:white;border-radius:14px;padding:15px;text-align:center}
.time-card.active{background:var(--accent);color:white;border-color:var(--accent)}
.custom-row{display:flex;gap:10px;margin-top:12px;align-items:center}
.custom-row input{width:130px;border:1px solid var(--line);border-radius:12px;padding:11px}
.primary,.btn,.linkbtn{border-radius:12px;padding:11px 15px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:600}
.start-row{margin-top:18px;display:flex;justify-content:flex-end}
.practice{margin-top:15px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
box-shadow:0 12px 34px rgba(25,33,26,.08)}
.image-wrap{height:min(70vh,760px);min-height:430px;position:relative;background:var(--soft);
display:grid;place-items:center;touch-action:pan-y}
.image-wrap img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .18s ease}
.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;background:var(--soft);color:var(--muted)}
.timer{position:absolute;right:16px;top:16px;min-width:104px;padding:13px 15px;text-align:center;
border-radius:999px;background:rgba(24,32,25,.86);color:white;backdrop-filter:blur(7px)}
.timer strong{font-size:26px;line-height:1}
.progress{position:absolute;bottom:0;left:0;width:100%;height:5px;background:var(--accent);transform-origin:left}
.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:17px 19px}
.meta h2{margin:0 0 5px;font-size:clamp(21px,3vw,31px)}
.meta p{margin:3px 0;color:var(--muted);font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.controls{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:11px}
.history-box{margin-top:11px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px}
.history-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:9px}
.history-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}
.thumb{position:relative;flex:0 0 82px;height:64px;border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.active{border-color:var(--accent)}
.thumb span{position:absolute;left:4px;bottom:3px;background:rgba(0,0,0,.55);color:white;border-radius:5px;font-size:10px;padding:2px 5px}
.tip{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 2px}
.error{color:var(--danger)}
@media(max-width:760px){
  .time-options{grid-template-columns:1fr 1fr}
  .controls{grid-template-columns:1fr 1fr}
  .meta{display:block}
  .links{margin-top:12px}
  .image-wrap{height:60vh;min-height:390px}
  .timer{right:10px;top:10px;min-width:88px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1>Flower Line</h1>
    <p>在线花卉写生练习</p>
  </header>

  <section class="setup" id="setup">
    <h2>选择练习时间</h2>
    <div class="time-options">
      <button class="time-card active" data-seconds="600">10 min</button>
      <button class="time-card" data-seconds="1200">20 min</button>
      <button class="time-card" data-seconds="0">∞ Infinite</button>
      <button class="time-card" data-seconds="custom">Custom</button>
    </div>
    <div class="custom-row hidden" id="customRow">
      <input id="customMinutes" type="number" min="1" step="1" value="15">
      <span>分钟</span>
    </div>
    <div class="start-row">
      <button class="primary" id="enterBtn">Start Drawing</button>
    </div>
  </section>

  <section class="practice hidden" id="practice">
    <main class="stage">
      <div class="image-wrap" id="imageWrap">
        <a id="imageLink" href="#" target="_blank" rel="noopener" style="width:100%;height:100%;display:block">
          <img id="flowerImage" alt="随机花卉参考图片">
        </a>
        <div id="status" class="status">正在连接在线图库…</div>
        <div class="timer"><strong id="timeText">10:00</strong></div>
        <div class="progress" id="progress"></div>
      </div>

      <section class="meta" id="metaPanel">
        <div>
          <h2 id="titleText">Random Flower</h2>
          <p id="creditText">Wikimedia Commons</p>
          <p id="statsText"></p>
        </div>
        <div class="links">
          <a class="linkbtn" id="sourceLink" href="#" target="_blank" rel="noopener">图片来源 ↗</a>
          <a class="linkbtn" id="licenseLink" href="#" target="_blank" rel="noopener">授权资料 ↗</a>
        </div>
      </section>
    </main>

    <section class="controls">
      <button class="primary" id="startBtn">开始</button>
      <button class="btn" id="pauseBtn">暂停</button>
      <button class="btn" id="resetBtn">重新计时</button>
      <button class="btn" id="prevBtn">← 上一张</button>
      <button class="btn" id="nextBtn">下一张 →</button>
      <button class="btn" id="hideBtn">隐藏资料</button>
      <button class="btn" id="fullBtn">全屏</button>
    </section>

    <section class="history-box">
      <div class="history-head">
        <span>最近查看</span>
        <span id="historyCount">0 / 10</span>
      </div>
      <div class="history-strip" id="historyStrip"></div>
    </section>

    <div class="tip">← 上一张　→ 下一张　Space 暂停／继续　手机左右滑动切换</div>
  </section>
</div>

<script>
const API="https://commons.wikimedia.org/w/api.php";
const SEARCHES=[
  "flower photograph","flower close up photograph","flower blossom macro",
  "garden flower photograph","wildflower photograph","botanical garden flower",
  "tropical flower photograph","spring flower photograph","summer flower photograph",
  "Australian native flower","alpine flower photograph","meadow flower photograph",
  "ornamental flower photograph","flowering plant close up","single flower photograph",
  "flower bloom nature photograph"
];
const BLOCK_WORDS=[
  "illustration","painting","drawing","herbarium","specimen","diagram","map","logo",
  "icon","stamp","coin","textile","poster","book","scan","plate"
];

const $=id=>document.getElementById(id);
const img=$("flowerImage");
let selectedSeconds=600,total=600,remaining=600,running=false,timerId=null;
let pool=[],sessionUsed=new Set(),recentSeen=loadRecent(),failed=new Set();
let queryIndex=Math.floor(Math.random()*SEARCHES.length);
let offset=Math.floor(Math.random()*220);
let loading=false,current=null;
let viewHistory=[],historyPos=-1;
let touchX=null,touchY=null,lastNextAt=0;

const RECENT_KEY="flowerLineSeenV2";
const MAX_RECENT=900;
const MAX_VIEW=10;

function loadRecent(){
  try{return new Set(JSON.parse(localStorage.getItem(RECENT_KEY)||"[]"))}
  catch{return new Set()}
}
function remember(page){
  recentSeen.add(page);
  let arr=[...recentSeen];
  if(arr.length>MAX_RECENT)arr=arr.slice(-MAX_RECENT);
  recentSeen=new Set(arr);
  try{localStorage.setItem(RECENT_KEY,JSON.stringify(arr))}catch{}
}
function clean(html=""){
  const d=document.createElement("div");d.innerHTML=html;
  return(d.textContent||"").trim()
}
function titleClean(t=""){
  return t.replace(/^File:/i,"").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim()
}
function format(sec){
  if(sec===0)return"∞";
  return`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`
}
function updateClock(){
  $("timeText").textContent=format(remaining);
  $("progress").style.transform=total===0?"scaleX(1)":`scaleX(${Math.max(0,remaining/total)})`
}
function pauseTimer(){running=false;clearInterval(timerId)}
function resetTimer(restart=false){
  pauseTimer();total=selectedSeconds;remaining=total;updateClock();
  if(restart)startTimer()
}
function startTimer(){
  if(running)return;
  running=true;
  if(total===0){updateClock();return}
  clearInterval(timerId);
  timerId=setInterval(()=>{
    remaining--;updateClock();
    if(remaining<=0){pauseTimer();nextRandom(true)}
  },1000)
}
function validPage(p){
  const ii=p.imageinfo?.[0],m=ii?.extmetadata||{};
  if(!ii?.thumburl||!ii?.descriptionurl)return false;
  if(!["image/jpeg","image/png","image/webp"].includes((ii.mime||"").toLowerCase()))return false;
  if((ii.width||0)<900||(ii.height||0)<650)return false;
  const lower=(p.title+" "+clean(m.ImageDescription?.value||"")).toLowerCase();
  if(BLOCK_WORDS.some(w=>lower.includes(w)))return false;
  const license=clean(m.LicenseShortName?.value||m.License?.value||m.UsageTerms?.value||"");
  if(!license)return false;
  if(/copyrighted|all rights reserved/i.test(license))return false;
  return true;
}
function toItem(p){
  const ii=p.imageinfo[0],m=ii.extmetadata||{};
  return{
    title:titleClean(p.title)||"Random Flower",
    url:ii.thumburl,
    page:ii.descriptionurl,
    artist:clean(m.Artist?.value||m.Credit?.value||"Wikimedia Commons"),
    licenseName:clean(m.LicenseShortName?.value||m.License?.value||m.UsageTerms?.value||"授权资料"),
    license:m.LicenseUrl?.value||ii.descriptionurl
  }
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]
  }
  return a
}
async function fetchBatch(){
  if(loading)return;
  loading=true;
  try{
    const q=SEARCHES[queryIndex%SEARCHES.length];
    const params=new URLSearchParams({
      action:"query",generator:"search",gsrsearch:q,gsrnamespace:"6",
      gsrlimit:"50",gsroffset:String(offset),prop:"imageinfo",
      iiprop:"url|mime|size|extmetadata",iiurlwidth:"1800",
      format:"json",origin:"*"
    });
    const r=await fetch(`${API}?${params}`);
    if(!r.ok)throw new Error("网络错误");
    const data=await r.json();
    let pages=Object.values(data.query?.pages||{}).filter(validPage).map(toItem);
    pages=shuffle(pages).filter(x=>!sessionUsed.has(x.page)&&!failed.has(x.url));

    const unseen=pages.filter(x=>!recentSeen.has(x.page));
    pool.push(...(unseen.length?unseen:pages));

    offset+=50+Math.floor(Math.random()*70);
    if(offset>900){offset=Math.floor(Math.random()*220);queryIndex=(queryIndex+1)%SEARCHES.length}
    else if(Math.random()<.42){queryIndex=(queryIndex+1+Math.floor(Math.random()*4))%SEARCHES.length}

    if(pool.length<8&&pages.length===0){
      offset=Math.floor(Math.random()*300);
      queryIndex=(queryIndex+1)%SEARCHES.length;
    }
  }finally{loading=false}
}
async function ensurePool(){
  let tries=0;
  while(pool.length<10&&tries<5){await fetchBatch();tries++}
}
function addHistory(item){
  if(historyPos>=0&&historyPos<viewHistory.length-1)viewHistory=viewHistory.slice(0,historyPos+1);
  if(viewHistory.at(-1)?.page!==item.page)viewHistory.push(item);
  if(viewHistory.length>MAX_VIEW)viewHistory.shift();
  historyPos=viewHistory.length-1;
  renderHistory()
}
function renderHistory(){
  const strip=$("historyStrip");strip.innerHTML="";
  viewHistory.forEach((item,i)=>{
    const b=document.createElement("button");
    b.className="thumb"+(i===historyPos?" active":"");
    b.title=item.title;
    const im=document.createElement("img");im.src=item.url;im.alt=item.title;im.loading="lazy";
    const n=document.createElement("span");n.textContent=i+1;
    b.append(im,n);b.onclick=()=>showHistory(i);strip.appendChild(b)
  });
  $("historyCount").textContent=`${viewHistory.length} / ${MAX_VIEW}`;
  requestAnimationFrame(()=>strip.querySelector(".active")?.scrollIntoView({behavior:"smooth",inline:"nearest",block:"nearest"}))
}
function showItem(item,{add=true,restart=false}={}){
  current=item;
  $("status").classList.remove("hidden");
  $("status").classList.remove("error");
  $("status").textContent="正在载入图片…";
  img.style.opacity="0";

  img.onload=()=>{
    $("status").classList.add("hidden");
    img.style.opacity="1";
    $("titleText").textContent=item.title;
    $("creditText").textContent=`摄影／上传者：${item.artist}`;
    $("statsText").textContent=`授权：${item.licenseName} · 在线候选 ${pool.length} 张`;
    $("imageLink").href=item.page;
    $("sourceLink").href=item.page;
    $("licenseLink").href=item.license;
    remember(item.page);
    if(add)addHistory(item);else renderHistory();
    resetTimer(restart)
  };
  img.onerror=()=>{
    failed.add(item.url);
    $("status").classList.remove("hidden");
    $("status").classList.add("error");
    $("status").textContent="图片载入失败，正在自动跳过…";
    setTimeout(()=>nextRandom(restart),450)
  };
  img.src=item.url
}
async function nextRandom(autoStart=running){
  const now=Date.now();
  if(now-lastNextAt<300)return;
  lastNextAt=now;
  pauseTimer();
  $("status").classList.remove("hidden");
  $("status").textContent="正在寻找随机花卉…";
  await ensurePool();
  let item=null;
  while(pool.length&&!item){
    const idx=Math.floor(Math.random()*pool.length);
    const candidate=pool.splice(idx,1)[0];
    if(!sessionUsed.has(candidate.page))item=candidate
  }
  if(!item){
    sessionUsed.clear();recentSeen.clear();
    await fetchBatch();
    item=pool.shift()
  }
  if(!item){
    $("status").classList.add("error");
    $("status").textContent="暂时无法取得图片，请检查网络后再试。";
    return
  }
  sessionUsed.add(item.page);
  showItem(item,{add:true,restart:autoStart});
  if(pool.length<12)fetchBatch()
}
function showHistory(i){
  if(i<0||i>=viewHistory.length)return;
  const wasRunning=running;
  pauseTimer();historyPos=i;
  showItem(viewHistory[i],{add:false,restart:wasRunning})
}
function previous(){
  if(historyPos>0)showHistory(historyPos-1)
}
function forward(){
  if(historyPos>=0&&historyPos<viewHistory.length-1)showHistory(historyPos+1);
  else nextRandom(running)
}

document.querySelectorAll(".time-card").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".time-card").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    const v=btn.dataset.seconds;
    $("customRow").classList.toggle("hidden",v!=="custom");
    selectedSeconds=v==="custom"?Math.max(60,Number($("customMinutes").value||15)*60):Number(v)
  }
});
$("customMinutes").oninput=()=>{
  selectedSeconds=Math.max(60,Number($("customMinutes").value||1)*60)
};
$("enterBtn").onclick=()=>{
  const active=document.querySelector(".time-card.active")?.dataset.seconds;
  selectedSeconds=active==="custom"?Math.max(60,Number($("customMinutes").value||15)*60):Number(active||600);
  total=selectedSeconds;remaining=total;updateClock();
  $("setup").classList.add("hidden");$("practice").classList.remove("hidden");
  nextRandom(false)
};
$("startBtn").onclick=startTimer;
$("pauseBtn").onclick=pauseTimer;
$("resetBtn").onclick=()=>resetTimer(running);
$("prevBtn").onclick=previous;
$("nextBtn").onclick=forward;
$("hideBtn").onclick=()=>{
  $("metaPanel").classList.toggle("hidden");
  $("hideBtn").textContent=$("metaPanel").classList.contains("hidden")?"显示资料":"隐藏资料"
};
$("fullBtn").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen()
  }catch{}
};

document.addEventListener("keydown",e=>{
  if($("practice").classList.contains("hidden"))return;
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(e.code==="Space"){e.preventDefault();running?pauseTimer():startTimer()}
  else if(e.key==="ArrowLeft")previous();
  else if(e.key==="ArrowRight")forward();
  else if(e.key.toLowerCase()==="r")resetTimer(running);
  else if(e.key.toLowerCase()==="h")$("hideBtn").click();
  else if(e.key.toLowerCase()==="f")$("fullBtn").click()
});
$("imageWrap").addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY
},{passive:true});
$("imageWrap").addEventListener("touchend",e=>{
  if(touchX===null)return;
  const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;
  touchX=touchY=null;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3){dx>0?previous():forward()}
},{passive:true});
window.addEventListener("online",()=>{if(!img.naturalWidth&&current)showItem(current,{add:false,restart:false})});
updateClock();
</script>
</body>
</html>
